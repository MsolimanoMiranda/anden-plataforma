apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: anden-pv
  labels:
    app: anden
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ebs-gp3
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-anden-demo
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anden-datos
  namespace: anden
  labels:
    app: anden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-gp3
  volumeName: anden-pv
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: puesto-con-disco
  namespace: anden
  labels:
    app: puesto-disco
spec:
  containers:
    - name: puesto
      image: nginx:1.27
      volumeMounts:
        - name: datos
          mountPath: /datos
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
  volumes:
    - name: datos
      persistentVolumeClaim:
        claimName: anden-datos
