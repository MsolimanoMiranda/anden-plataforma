apiVersion: apps/v1
kind: Deployment
metadata:
  name: mostrador-roll
  namespace: anden
  labels:
    app: mostrador-roll
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mostrador-roll
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mostrador-roll
    spec:
      containers:
        - name: mostrador
          image: nginx:1.27
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
