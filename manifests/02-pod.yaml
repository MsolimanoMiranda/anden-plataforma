apiVersion: v1
kind: Pod
metadata:
  name: puesto
  namespace: anden
  labels:
    app: puesto
    rol: demo
spec:
  containers:
    - name: puesto
      image: nginx:1.27
      ports:
        - containerPort: 80
      env:
        - name: PUESTO
          valueFrom:
            configMapKeyRef:
              name: anden-config
              key: puesto
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: anden-secret
              key: token
        - name: AMBIENTE
          value: demo
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
