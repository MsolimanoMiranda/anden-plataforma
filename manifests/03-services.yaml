apiVersion: v1
kind: Service
metadata:
  name: puesto
  namespace: anden
  labels:
    app: puesto
spec:
  type: ClusterIP
  selector:
    app: puesto
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: puesto-nodo
  namespace: anden
  labels:
    app: puesto
spec:
  type: NodePort
  selector:
    app: puesto
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: puesto-publico
  namespace: anden
  labels:
    app: puesto
spec:
  type: LoadBalancer
  selector:
    app: puesto
  ports:
    - name: http
      port: 80
      targetPort: 80
