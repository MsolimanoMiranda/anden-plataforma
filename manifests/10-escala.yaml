apiVersion: v1
kind: ResourceQuota
metadata:
  name: cupo
  namespace: anden
spec:
  hard:
    pods: "30"
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mostrador-roll
  namespace: anden
  labels:
    app: mostrador-roll
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mostrador-roll
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
